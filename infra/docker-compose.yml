# Lingkungan pengembangan lokal. Jangan memakai kredensial ini di produksi.
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: etangguh
      POSTGRES_PASSWORD: etangguh
      POSTGRES_DB: etangguh
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U etangguh -d etangguh']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
